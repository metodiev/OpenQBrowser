<?xml version="1.0" encoding="UTF-8"?>
<!--
  The OpenQBrowser mark: the letter Q on a rounded tile.

  It is deliberately just the letter. An earlier version added a window title
  bar and an address bar, which are invisible at Dock size and made the bowl and
  its tail read as a magnifying glass rather than as a Q. A single letterform
  survives being scaled down to 16 pixels, which is the size that matters most.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f93da"/>
      <stop offset="1" stop-color="#1b5c94"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Rounded tile, the shape a macOS icon is drawn on. -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#tile)"/>
  <rect x="4" y="4" width="120" height="60" rx="28" fill="url(#gloss)"/>

  <!--
    The letter Q. The tail starts inside the bowl and crosses its stroke at four
    o'clock, which is what makes it a letter rather than a handle attached to a
    ring: a handle would begin at the edge and leave a visible joint.
  -->
  <g fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round">
    <ellipse cx="62" cy="58" rx="31" ry="29"/>
    <path d="M80 76 L99 96"/>
  </g>
</svg>
